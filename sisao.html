<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sisão do simulado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sisao/styles.css?v=202611102345">
<style>
body{margin:0}
.sx-wrap{max-width:720px;margin:0 auto;padding:16px}
.sx-capa{background:radial-gradient(ellipse at 50% 0,#2b4bd8 0,#0b1a6b 55%,#050a2e 100%);color:#fff;border-radius:22px;padding:22px 18px;text-align:center;border:2px solid rgba(255,210,74,.5)}
.sx-capa h1{font-family:'Bungee',var(--f-display),sans-serif;font-size:clamp(28px,8vw,42px);color:#ffd24a;text-shadow:0 3px 0 #8a5a00,0 0 18px rgba(255,210,74,.5);margin:6px 0}
.sx-capa p{color:#cfe0ff;margin:6px 0 16px}
.sx-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 4px}
.sx-chip{font-family:var(--f-display);font-weight:600;font-size:16px;border-radius:999px;padding:10px 16px;border:2px solid rgba(255,210,74,.45);background:rgba(5,10,46,.55);color:#fff;cursor:pointer}
.sx-chip[aria-pressed="true"]{background:#ffd24a;color:#3a2600;border-color:#ffd24a}
.sx-chip small{opacity:.7;margin-left:6px}
.sx-err{color:#ffb3bd;min-height:20px;font-size:14px}
.sx-volta{display:inline-block;margin-bottom:10px;color:var(--muted);text-decoration:none;font-size:15px}
</style>
</head>
<body>
<div class="sx-wrap"><a class="sx-volta" href="./">← Voltar ao simulado</a><div id="palco"></div></div>
<script src="bancos.js?v=202611102345"></script>
<script src="sisao/sons.js?v=202611102345"></script>
<script src="sisao/locutor.js?v=202611102350"></script>
<script src="sisao/milhao.js?v=202611110040"></script>
<script>
(function(){
const B = window.BANCOS || {};
const NOMES = {bases:'Bases Morfológicas', carie:'Cárie', inter:'Interações'};
const palco = document.getElementById('palco');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const emb = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let escolha = new Set(['carie','inter']);
try { const s = JSON.parse(localStorage.getItem('sisao-simulado-materias') || 'null'); if (Array.isArray(s) && s.length) escolha = new Set(s); } catch(e) {}

function dificuldade(q){
  const txt = (q.ctx || '') + ' ' + (q.p || '');
  let s = txt.length / 60;
  if (/\bI{1,3}\.|\bI{1,3}\s*[-–)]|assertiva|asserç|afirmativa|afirmaç/i.test(txt)) s += 6;
  if (q.sm1) s += 3;
  return s;
}
// questões do simulado (5 alternativas) viram perguntas do Sisão (4 alternativas: a certa + 3 erradas sorteadas)
function bancoDoSimulado(){
  const lista = [];
  escolha.forEach(m => (B[m] && B[m].q || []).forEach(q => {
    if (!q || !q.p || !Array.isArray(q.o) || q.o.length < 4 || typeof q.a !== 'number') return;
    const certa = q.o[q.a];
    const erradas = emb(q.o.filter((x, k) => k !== q.a)).slice(0, 3);
    const ops = emb([certa, ...erradas]);
    if (new Set(ops.map(x => String(x).trim().toLowerCase())).size !== 4) return;
    lista.push({ m: NOMES[m], q: (q.ctx ? q.ctx + '\n\n' : '') + q.p, o: ops, a: ops.indexOf(certa), w: q.w || '', _d: dificuldade(q) });
  }));
  const ord = lista.sort((a, b) => a._d - b._d), t = Math.ceil(ord.length / 3);
  ord.forEach((q, i) => { q.n = i < t ? 1 : i < 2 * t ? 2 : 3; delete q._d; });
  return ord;
}

const api = {
  esc,
  voltar: () => capa(),
  toast: msg => { const d = document.createElement('div'); d.textContent = msg; d.style.cssText = 'position:sticky;bottom:12px;margin:12px auto 0;max-width:420px;background:#15213b;color:#fff;padding:10px 14px;border-radius:12px;text-align:center'; palco.appendChild(d); setTimeout(() => d.remove(), 2200); },
  ganhou: () => {}, perdeu: () => {}
};

function capa(msg){
  const total = m => (B[m] && B[m].q || []).length;
  palco.innerHTML = `
  <section class="sx-capa">
    <h1>Sisão do simulado</h1>
    <p>O Show do Sisão só com as questões do simulado. Escolha o que quer estudar.</p>
    <div class="sx-chips">
      ${Object.keys(NOMES).filter(m => B[m]).map(m => `<button type="button" class="sx-chip" data-m="${m}" aria-pressed="${escolha.has(m)}">${NOMES[m]}<small>${total(m)}</small></button>`).join('')}
      <button type="button" class="sx-chip" data-m="todas" aria-pressed="${escolha.size === 3}">As três juntas</button>
    </div>
    <div class="sx-err">${esc(msg || '')}</div>
    <button type="button" class="btn full" id="ir">Começar</button>
  </section>`;
  palco.querySelectorAll('.sx-chip').forEach(b => b.onclick = () => {
    const m = b.dataset.m;
    if (m === 'todas') escolha = new Set(Object.keys(NOMES).filter(k => B[k]));
    else escolha.has(m) ? escolha.delete(m) : escolha.add(m);
    try { localStorage.setItem('sisao-simulado-materias', JSON.stringify([...escolha])); } catch(e) {}
    capa();
  });
  palco.querySelector('#ir').onclick = () => {
    if (!escolha.size) { capa('Escolha pelo menos uma matéria'); return; }
    window.BANCO_MILHAO = bancoDoSimulado();
    const jogo = (window.JOGOS || []).find(j => j.id === 'milhao');
    if (!jogo || !jogo.disponivel()) { capa('Poucas perguntas nessa matéria. Junte com outra.'); return; }
    palco.innerHTML = '';
    jogo.montar(palco, {}, api);
  };
}
capa();
})();
</script>
</body>
</html>
